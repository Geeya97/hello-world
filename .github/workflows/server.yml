name: Server

on:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install
        working-directory: server
        run: npm install --no-audit --no-fund

      # Covers the BOM parser, the wet-bulb maths, report formatting, and the
      # recipient rule including its Android and artifact ports.
      - name: Test
        working-directory: server
        run: npm test
