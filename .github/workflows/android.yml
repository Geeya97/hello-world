name: Android

# Builds the Current Weather App APK. The development container has no Android
# SDK, so this workflow is where the app actually gets compiled — download the
# APK from the run's Artifacts section.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'Backend base URL to bake into the build'
        required: false
        default: 'http://10.0.2.2:8787'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PapiBaseUrl="${{ github.event.inputs.apiBaseUrl || 'http://10.0.2.2:8787' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: current-weather-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
